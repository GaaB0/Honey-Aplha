plugins {
    id 'com.android.application'
}

android {
    namespace 'com.honeyspace.bridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.honeyspace.bridge'
        minSdk 26
        targetSdk 35
        versionCode 34
        versionName '4.8'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
